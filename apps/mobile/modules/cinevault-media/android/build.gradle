plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'nl.cinevault'
version = '0.1.0'

android {
  namespace "nl.cinevault.media"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // UIManagerHelper and ReactContext, to give a view the focus (focusView).
  implementation 'com.facebook.react:react-android'
}
