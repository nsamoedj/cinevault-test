# The TV screens on an Android TV emulator (1080p), with the demo library of
# the browser tests (E2E_DEMO=1): logs in and takes screenshots of each
# screen, moving with the remote's D-pad. android-smoke.yml publishes them as
# the pre-release "tv-screens".
appId: nl.cinevault.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Verbinden met je server"
    timeout: 180000
- tapOn: "Serveradres"
- inputText: "10.0.2.2:3100"
- hideKeyboard
- tapOn: "Verbinden"
- extendedWaitUntil:
    visible: "Inloggen met wachtwoord"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-01-login
- tapOn: "Inloggen met wachtwoord"
- tapOn:
    text: "Iemand anders"
    optional: true
- extendedWaitUntil:
    visible: "Gebruikersnaam"
    timeout: 60000
- tapOn: "Gebruikersnaam"
- inputText: "tester"
- hideKeyboard
- tapOn: "Wachtwoord"
- inputText: "e2e-wachtwoord-123"
- hideKeyboard
# The button, not the heading "Inloggen" above the fields.
- tapOn:
    text: "Inloggen"
    below: "Wachtwoord"
- extendedWaitUntil:
    visible: "Ontdekken"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: tv-02-home
# Into the rows.
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-03-home-row1
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Right
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-04-home-row2
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-05-home-row4
# A title from the rows.
- pressKey: Remote Dpad Center
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: tv-06-item
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-07-item-below
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 5000
# The menu.
- pressKey: Remote Dpad Left
- pressKey: Remote Dpad Left
- pressKey: Remote Dpad Left
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-08-menu
- tapOn:
    text: "Films"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: tv-09-library
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Right
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-10-library-focus
- tapOn:
    text: "Series"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- pressKey: Remote Dpad Center
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: tv-11-show
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-12-show-seasons
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-13-show-episodes
- pressKey: Back
- tapOn:
    text: "Zoeken"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: tv-14-search
- tapOn:
    text: "Ontdekken"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: tv-15-discover
- tapOn:
    text: "Profiel"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: tv-16-profile
# The player, from a film's page.
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Meer info"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "Pauzeren|Afspelen"
    timeout: 60000
    optional: true
- pressKey: Remote Dpad Center
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: tv-17-player
